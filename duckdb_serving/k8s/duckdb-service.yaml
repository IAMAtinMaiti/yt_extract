apiVersion: v1
kind: Service
metadata:
  name: duckdb-service
  namespace: duckdb
  labels:
    app: duckdb
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: duckdb
    component: server
---
apiVersion: v1
kind: Service
metadata:
  name: duckdb-service-lb
  namespace: duckdb
  labels:
    app: duckdb
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: duckdb
    component: server

