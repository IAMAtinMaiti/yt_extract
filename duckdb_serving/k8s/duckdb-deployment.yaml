apiVersion: apps/v1
kind: Deployment
metadata:
  name: duckdb-server
  namespace: duckdb
  labels:
    app: duckdb
    component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: duckdb
      component: server
  template:
    metadata:
      labels:
        app: duckdb
        component: server
    spec:
      containers:
      - name: duckdb
        image: duckdb-server:latest
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DUCKDB_DATA_PATH
          value: /data/duckdb/data.duckdb
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: duckdb-data
          mountPath: /data/duckdb
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      volumes:
      - name: duckdb-data
        persistentVolumeClaim:
          claimName: duckdb-pvc

