apiVersion: v1
kind: PersistentVolume
metadata:
  name: duckdb-pv
  labels:
    app: duckdb
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  # Using hostPath for local testing; for production use appropriate storage class
  hostPath:
    path: /mnt/duckdb-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: duckdb-pvc
  namespace: default
  labels:
    app: duckdb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

